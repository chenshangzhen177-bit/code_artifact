<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 設定網頁編碼為 UTF-8 -->
    <meta charset="UTF-8">
    <!-- 設定響應式視口，確保在手機與電腦上都能完美顯示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神秘星空塔羅占卜 - 過去・現在・未來</title>
    <!-- 引入 Google Fonts 典雅字型 (Cinzel 與 Noto Serif TC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+TC:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --------------------------------------------------
         * CSS 樣式設定
         * -------------------------------------------------- */
        
        /* 全局變數定義：色調與視覺風格 */
        :root {
            --bg-primary: #0a0612;        /* 極深紫藍背景色 */
            --bg-card-back: #180f2b;      /* 牌背深紫色 */
            --gold-primary: #f3e5ab;     /* 主金色 */
            --gold-bright: #ffd700;      /* 明亮黃金 */
            --gold-dark: #b8860b;        /* 暗金色 */
            --purple-glow: #8a2be2;      /* 紫光 neon 效果 */
            --cyan-glow: #00ffff;        /* 青光 neon 效果 */
            --text-light: #e0d6f3;       /* 淡紫色文字 */
            --font-title: 'Cinzel', 'Noto Serif TC', serif; /* 標題字型 */
            --font-body: 'Noto Serif TC', serif;          /* 正文字型 */
        }

        /* 消除所有元素預設內外邊距，設定盒模型 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 設定整體網頁基本樣式 */
        body {
            background-color: var(--bg-primary);
            color: var(--text-light);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Canvas 星空背景懸浮全螢幕 */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; /* 放置於最底層 */
            pointer-events: none; /* 不擋住滑鼠點擊 */
        }

        /* 主要內容包裹容器 */
        .container {
            position: relative;
            z-index: 1; /* 層級高於星空背景 */
            width: 100%;
            max-width: 1100px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 標題區塊樣式 */
        header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        /* 主標題樣式：金屬漸層與霓虹發光 */
        h1 {
            font-family: var(--font-title);
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(243, 229, 171, 0.3), 0 0 30px rgba(138, 43, 226, 0.4);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        /* 副標題樣式 */
        .subtitle {
            font-size: 1.05rem;
            color: #bfa8e0;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        /* 典雅金邊分割線 */
        .divider {
            width: 180px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            margin: 15px auto;
            position: relative;
        }

        /* 分割線中央菱形點綴 */
        .divider::after {
            content: '✦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--gold-primary);
            font-size: 12px;
            background: var(--bg-primary);
            padding: 0 8px;
        }

        /* 操作控制區塊 (洗牌按鈕與提示語) */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        /* 神秘風奢華按鈕 */
        .btn-tarot {
            background: linear-gradient(135deg, #2a124d 0%, #15092b 100%);
            color: var(--gold-primary);
            font-family: var(--font-body);
            font-size: 1.1rem;
            font-weight: 600;
            padding: 12px 36px;
            border: 1px solid var(--gold-primary);
            border-radius: 30px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.3), inset 0 0 10px rgba(243, 229, 171, 0.1);
            letter-spacing: 1px;
        }

        /* 按鈕懸浮 (Hover) 效果 */
        .btn-tarot:hover {
            color: #fff;
            border-color: var(--gold-bright);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6), 0 0 40px rgba(138, 43, 226, 0.6);
            transform: translateY(-2px);
        }

        /* 按鈕點擊狀態 */
        .btn-tarot:active {
            transform: translateY(1px);
        }

        /* 停用狀態按鈕 */
        .btn-tarot:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #666;
            box-shadow: none;
        }

        /* 提示文字動畫 */
        .status-msg {
            font-size: 1rem;
            color: var(--gold-primary);
            min-height: 24px;
            text-align: center;
            animation: pulseText 2s infinite ease-in-out;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; text-shadow: 0 0 10px var(--purple-glow); }
        }

        /* 塔羅牌展示區域 (三張牌佈局) */
        .cards-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            width: 100%;
            flex-wrap: wrap; /* 支援手機螢幕換行 */
            margin-bottom: 40px;
            perspective: 1000px; /* 提供 3D 翻牌視角透視 */
        }

        /* 單張塔羅牌 Slot 外殼 */
        .card-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        /* 牌陣位置標籤 (過去、現在、未來) */
        .slot-title {
            font-size: 1.1rem;
            color: var(--gold-primary);
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* 塔羅牌主體容器 (提供 3D 翻轉空間) */
        .card {
            width: 180px;
            height: 310px;
            position: relative;
            transform-style: preserve-3d; /* 啟用 3D 子元素翻轉 */
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 流暢彈性翻牌 */
            cursor: pointer;
            border-radius: 12px;
        }

        /* 當卡片被標記翻面時的 CSS 類別 */
        .card.flipped {
            transform: rotateY(180deg);
        }

        /* 洗牌時的晃動動畫 */
        .card.shuffling {
            animation: shuffleAnim 0.6s ease-in-out infinite alternate;
        }

        @keyframes shuffleAnim {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(5deg); }
        }

        /* 卡片正面與背面的共同基礎樣式 */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* 隱藏背面，達到翻牌效果 */
            border-radius: 12px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(138, 43, 226, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: var(--bg-card-back);
        }

        /* --------------------------------------------------
         * 塔羅牌背面圖案與典雅幾何線條
         * -------------------------------------------------- */
        .card-back {
            background: radial-gradient(circle, #2c1654 0%, #110724 100%);
        }

        /* 牌背外圍古典內框 */
        .card-back-frame {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(243, 229, 171, 0.4);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 牌背中央神秘圖騰 (雙交錯陣圖) */
        .card-back-pattern {
            width: 80px;
            height: 80px;
            border: 1px solid var(--gold-primary);
            transform: rotate(45deg);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-back-pattern::before {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            border: 1px solid var(--gold-primary);
            transform: rotate(45deg);
        }

        .card-back-symbol {
            font-size: 2rem;
            color: var(--gold-bright);
            transform: rotate(-45deg); /* 將符號轉回正向 */
            text-shadow: 0 0 10px var(--gold-bright);
        }

        /* --------------------------------------------------
         * 塔羅牌正面圖案樣式
         * -------------------------------------------------- */
        .card-front {
            background: linear-gradient(180deg, #1f113a 0%, #0d061a 100%);
            transform: rotateY(180deg); /* 預設翻轉180度隱藏在背面 */
            border-color: var(--gold-bright);
        }

        /* 牌面四角典雅星芒裝飾 */
        .card-corner {
            position: absolute;
            font-size: 10px;
            color: var(--gold-primary);
        }
        .top-left { top: 6px; left: 6px; }
        .top-right { top: 6px; right: 6px; }
        .bottom-left { bottom: 6px; left: 6px; }
        .bottom-right { bottom: 6px; right: 6px; }

        /* 牌面羅馬數字與名稱 */
        .card-num {
            font-family: var(--font-title);
            font-size: 0.9rem;
            color: var(--gold-primary);
            letter-spacing: 1px;
        }

        /* 牌面主要符號/圖騰顯示區 */
        .card-icon {
            font-size: 4rem;
            margin: 10px 0;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.5));
            transition: transform 0.3s;
        }

        /* 滑鼠懸浮正面牌圖案微放大 */
        .card-front:hover .card-icon {
            transform: scale(1.1);
        }

        .card-name {
            font-family: var(--font-body);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold-primary);
            text-align: center;
            border-top: 1px solid rgba(243, 229, 171, 0.3);
            border-bottom: 1px solid rgba(243, 229, 171, 0.3);
            padding: 4px 0;
            width: 100%;
        }

        .card-keywords {
            font-size: 0.75rem;
            color: #bfa8e0;
            text-align: center;
        }

        /* --------------------------------------------------
         * 牌義解析詳細結果顯示區
         * -------------------------------------------------- */
        .result-container {
            width: 100%;
            background: rgba(20, 10, 38, 0.75);
            border: 1px solid var(--gold-primary);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px); /* 毛玻璃模糊質感 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(138, 43, 226, 0.2);
            display: none; /* 預設隱藏，抽完牌後顯示 */
            animation: fadeIn 1s forwards ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            text-align: center;
            font-size: 1.6rem;
            color: var(--gold-bright);
            font-family: var(--font-title);
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(243, 229, 171, 0.4);
        }

        /* 三張牌解析的格狀佈局 */
        .reading-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        /* 單個牌義解析卡片 */
        .reading-card {
            background: rgba(35, 18, 66, 0.6);
            border: 1px solid rgba(243, 229, 171, 0.3);
            border-radius: 10px;
            padding: 20px;
            transition: border-color 0.3s;
        }

        .reading-card:hover {
            border-color: var(--gold-bright);
        }

        .reading-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            border-bottom: 1px dashed rgba(243, 229, 171, 0.2);
            padding-bottom: 8px;
        }

        .reading-position {
            background: var(--gold-primary);
            color: var(--bg-primary);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .reading-card-name {
            font-size: 1.1rem;
            color: var(--gold-primary);
            font-weight: 600;
        }

        .reading-desc {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-light);
        }

        /* 總結建議區塊 */
        .summary-box {
            background: linear-gradient(135deg, rgba(42, 18, 77, 0.8) 0%, rgba(21, 9, 43, 0.8) 100%);
            border: 1px solid var(--gold-primary);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .summary-title {
            font-size: 1.2rem;
            color: var(--gold-bright);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .summary-text {
            font-size: 1rem;
            line-height: 1.7;
            color: #ece4f7;
        }

        /* --------------------------------------------------
         * 響應式手機微調
         * -------------------------------------------------- */
        @media (max-width: 650px) {
            .cards-display {
                gap: 15px;
            }
            .card {
                width: 100px;
                height: 170px;
            }
            .card-icon {
                font-size: 2.2rem;
            }
            .card-name {
                font-size: 0.85rem;
            }
            .card-keywords {
                display: none; /* 手機版螢幕較小，隱藏關鍵字保持簡潔 */
            }
            .card-num {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- 1. 動態星空背景 Canvas 元素 -->
    <canvas id="starfield"></canvas>

    <!-- 2. 塔羅占卜主內容容器 -->
    <div class="container">
        
        <!-- 頁面標題區塊 -->
        <header>
            <h1>TAROT DIVINATION</h1>
            <div class="subtitle">神秘星空塔羅・解開過去、現在與未來的命運啟示</div>
            <div class="divider"></div>
        </header>

        <!-- 洗牌與操作控制區 -->
        <div class="controls">
            <button id="btnShuffle" class="btn-tarot">開啟命運之門 (洗牌)</button>
            <div id="statusMsg" class="status-msg">靜心並專注於您心中的問題，隨後點擊上方按鈕洗牌...</div>
        </div>

        <!-- 3 牌陣卡片放置區 -->
        <div class="cards-display">
            <!-- 過去牌卡 Slot -->
            <div class="card-slot">
                <div class="slot-title">✦ 過去 ✦</div>
                <div class="card" id="card0" data-index="0">
                    <div class="card-face card-back">
                        <div class="card-back-frame">
                            <div class="card-back-pattern">
                                <span class="card-back-symbol">☽</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-face card-front" id="cardFront0">
                        <!-- 正面內容由 JavaScript 動態渲染 -->
                    </div>
                </div>
            </div>

            <!-- 現在牌卡 Slot -->
            <div class="card-slot">
                <div class="slot-title">✦ 現在 ✦</div>
                <div class="card" id="card1" data-index="1">
                    <div class="card-face card-back">
                        <div class="card-back-frame">
                            <div class="card-back-pattern">
                                <span class="card-back-symbol">☉</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-face card-front" id="cardFront1">
                        <!-- 正面內容由 JavaScript 動態渲染 -->
                    </div>
                </div>
            </div>

            <!-- 未來牌卡 Slot -->
            <div class="card-slot">
                <div class="slot-title">✦ 未來 ✦</div>
                <div class="card" id="card2" data-index="2">
                    <div class="card-face card-back">
                        <div class="card-back-frame">
                            <div class="card-back-pattern">
                                <span class="card-back-symbol">✦</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-face card-front" id="cardFront2">
                        <!-- 正面內容由 JavaScript 動態渲染 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 牌義解析結果說明區塊 -->
        <div id="resultContainer" class="result-container">
            <div class="result-title">― 命運啟示解析 ―</div>
            <div class="reading-grid" id="readingGrid">
                <!-- 由 JavaScript 填入三張牌的詳細說明 -->
            </div>
            <div class="summary-box">
                <div class="summary-title">✧ 星空指引與建議 ✧</div>
                <div class="summary-text" id="summaryText">
                    <!-- 由 JavaScript 填入綜合指引 -->
                </div>
            </div>
        </div>

    </div>

    <!-- --------------------------------------------------
     * JavaScript 邏輯控制與動畫
     * -------------------------------------------------- -->
    <script>
        /* ==================================================
         * 1. Canvas 閃爍星空與流星動畫
         * ================================================== */
        
        // 取得 Canvas 元素及其 2D 繪圖 context
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        // 定義儲存星星與流星的陣列
        let stars = [];
        let meteors = [];

        // 自動調整 Canvas 尺寸至全螢幕
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars(); // 視窗大小改變時重製星星
        }

        // 初始化星星陣列
        function initStars() {
            stars = [];
            // 根據螢幕面積計算星星數量，確保效能與視覺平衡
            const count = Math.floor((canvas.width * canvas.height) / 3000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: 0.005 + Math.random() * 0.015 // 閃爍頻率
                });
            }
        }

        // 產生單顆流星
        function createMeteor() {
            if (Math.random() < 0.03 && meteors.length < 3) { // 控制流星出現頻率
                meteors.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height / 2),
                    length: 80 + Math.random() * 60,
                    speed: 6 + Math.random() * 4,
                    angle: 45 * (Math.PI / 180), // 45度角劃過
                    alpha: 1
                });
            }
        }

        // 星空動畫繪製主循環
        function animateStars() {
            // 清空畫布 (背景色維持深色透明)
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 繪製星星
            stars.forEach(star => {
                // 改變星星透明度實現閃爍效果
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) {
                    star.speed = -star.speed;
                }

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(243, 229, 171, ${Math.abs(star.alpha)})`;
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#f3e5ab';
                ctx.fill();
            });

            // 繪製與更新流星
            createMeteor();
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                // 計算流星尾巴終點
                const endX = m.x - m.length * Math.cos(m.angle);
                const endY = m.y + m.length * Math.sin(m.angle);

                // 創建流星漸層尾跡
                const gradient = ctx.createLinearGradient(m.x, m.y, endX, endY);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${m.alpha})`);
                gradient.addColorStop(1, 'rgba(138, 43, 226, 0)');

                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(endX, endY);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.stroke();

                // 更新流星位置
                m.x += m.speed * Math.cos(m.angle);
                m.y += m.speed * Math.sin(m.angle);
                m.alpha -= 0.01;

                // 超出邊界或透明度歸零時移除流星
                if (m.alpha <= 0 || m.x > canvas.width || m.y > canvas.height) {
                    meteors.splice(i, 1);
                }
            }

            // 請求下一幀動畫
            requestAnimationFrame(animateStars);
        }

        // 監聽視窗大小改變事件
        window.addEventListener('resize', resizeCanvas);
        
        // 頁面載入後啟動星空
        resizeCanvas();
        animateStars();


        /* ==================================================
         * 2. 塔羅牌資料庫 (經典大阿爾克那選集)
         * ================================================== */
        const tarotDeck = [
            {

        /* ==================================================
         * 3. 占卜互動邏輯控制
         * ================================================== */

        // 取得 DOM 元素
        const btnShuffle = document.getElementById('btnShuffle');
        const statusMsg = document.getElementById('statusMsg');
        const resultContainer = document.getElementById('resultContainer');
        const readingGrid = document.getElementById('readingGrid');
        const summaryText = document.id ? document.getElementById('summaryText') : document.querySelector('#summaryText');

        // 狀態變數
        let selectedCards = []; // 抽出的三張牌
        let flippedCount = 0;    // 已翻開的卡片數量
        let isShuffling = false; // 是否洗牌中
        let isDrawn = false;     // 是否已完成抽牌

        // 綁定洗牌按鈕點擊事件
        btnShuffle.addEventListener('click', startDivination);

        // 初始化/洗牌流程
        function startDivination() {
            if (isShuffling) return;
            isShuffling = true;
            isDrawn = false;
            flippedCount = 0;

            // 1. 重製介面狀態
            btnShuffle.disabled = true;
            statusMsg.textContent = "命運之牌洗牌中，洗滌雜念...";
            resultContainer.style.display = 'none';

            // 2. 將所有卡片蓋轉回背面
            for (let i = 0; i < 3; i++) {
                const card = document.getElementById(`card${i}`);
                card.classList.remove('flipped');
                card.classList.add('shuffling'); // 加入洗牌搖晃動畫
            }

            // 3. 模擬洗牌時間 (1.5秒)
            setTimeout(() => {
                // 停止搖晃動畫
                for (let i = 0; i < 3; i++) {
                    const card = document.getElementById(`card${i}`);
                    card.classList.remove('shuffling');
                }

                // 洗牌演算法：隨機抽取 3 張不重複的牌
                selectedCards = getRandomCards(tarotDeck, 3);

                // 渲染卡片正面資訊
                for (let i = 0; i < 3; i++) {
                    renderCardFront(i, selectedCards[i]);
                    // 為卡片綁定點擊翻牌事件
                    const card = document.getElementById(`card${i}`);
                    card.onclick = () => flipCard(i);
                }

                statusMsg.textContent = "洗牌完成！請依序點擊「過去」、「現在」、「未來」卡片進行翻牌。";
                isShuffling = false;
            }, 1500);
        }

        // 隨機抽取不重複元素之函式 (Fisher-Yates 演算法概念)
        function getRandomCards(deck, count) {
            const shuffled = [...deck].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        // 動態生成卡片正面 HTML 結構
        function renderCardFront(index, cardData) {
            const frontEl = document.getElementById(`cardFront${index}`);
            frontEl.innerHTML = `
                <div class="card-corner top-left">✦</div>
                <div class="card-corner top-right">✦</div>
                <div class="card-num">${cardData.num}</div>
                <div class="card-icon">${cardData.icon}</div>
                <div class="card-name">${cardData.name}</div>
                <div class="card-keywords">${cardData.keywords}</div>
                <div class="card-corner bottom-left">✦</div>
                <div class="card-corner bottom-right">✦</div>
            `;
        }

        // 點擊翻牌邏輯
        function flipCard(index) {
            const card = document.getElementById(`card${index}`);

            // 若卡片已翻開或正處於洗牌中，則忽略點擊
            if (card.classList.contains('flipped') || isShuffling) return;

            // 執行翻牌 3D 旋轉
            card.classList.add('flipped');
            flippedCount++;

            // 當 3 張牌皆翻開時，顯示解析結果
            if (flippedCount === 3) {
                statusMsg.textContent = "星空已顯現命運之軌跡，請閱覽下方的詳細解析。";
                btnShuffle.disabled = false;
                btnShuffle.textContent = "重新占卜";

                // 延遲 0.8 秒等翻牌動畫完成後顯示解析
                setTimeout(showReadings, 800);
            } else {
                statusMsg.textContent = `已解開第 ${flippedCount} 張牌，請繼續點擊未翻開的卡片...`;
            }
        }

        // 渲染詳細牌義解析與總結
        function showReadings() {
            const positions = ["過去", "現在", "未來"];
            readingGrid.innerHTML = ""; // 清空舊內容

            // 填入三張牌的獨立解析
            selectedCards.forEach((card, i) => {
                const pos = positions[i];
                let descText = "";
                if (i === 0) descText = card.past;
                if (i === 1) descText = card.present;
                if (i === 2) descText = card.future;

                const readingHtml = `
                    <div class="reading-card">
                        <div class="reading-card-header">
                            <span class="reading-position">${pos}</span>
                            <span class="reading-card-name">${card.name}</span>
                        </div>
                        <div class="reading-desc">${descText}</div>
                    </div>
                `;
                readingGrid.innerHTML += readingHtml;
            });

            // 生成綜合指引建議
            summaryText.innerHTML = `
                從過去的<strong>【${selectedCards[0].name}】</strong>到眼前的<strong>【${selectedCards[1].name}】</strong>，
                代表你正經歷一段關鍵的轉折。只要穩住當前步調，未來的<strong>【${selectedCards[2].name}】</strong>將引導你走向理想的結局。
                保持內心的澄澈與信心，命運的指引始終與你同在。
            `;

            // 顯示結果區塊
            resultContainer.style.display = 'block';

            // 平滑滾動至解析區塊
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
